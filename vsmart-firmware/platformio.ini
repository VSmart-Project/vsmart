; PlatformIO — Vsmart firmware
;
;   pio run -e devkitc -t upload -t monitor   ; ESP32-DevKitC carrier Rev C
;   pio run -e s3mini                         ; ESP32-S3 SuperMini board
;
; Layout (see README.md "Project layout"):
;   lib/<Module>/   one folder per module, .h + .cpp — PlatformIO compiles these
;                   automatically and puts each folder on the include path
;   include/        shared headers ONLY (app_config.h, secrets.h). A .cpp placed
;                   here is silently NOT compiled — PlatformIO builds src_dir only
;   src/<board>/    board-specific pin tables; exactly one folder per environment
;                   is compiled, selected by build_src_filter below

[platformio]
default_envs = devkitc

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Libraries under lib/ do not see include_dir on their own — without this,
; anything in lib/ that includes app_config.h or secrets.h fails to compile.
build_flags =
    -Wall
    -I include
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    knolleary/PubSubClient @ ^2.8
    mikalhart/TinyGPSPlus @ ^1.0.3
    bblanchon/ArduinoJson @ ^7.0.0

[env:devkitc]
platform = espressif32
board = esp32doit-devkit-v1

build_src_filter = +<*> -<s3mini/>
build_flags = ${env.build_flags} -DBOARD_DEVKITC
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001


[env:s3mini]
platform = espressif32
board = esp32-s3-devkitc-1
build_src_filter = +<*> -<devkitc/>
build_flags =
    ${env.build_flags}
    -DBOARD_S3_MINI
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Bench bring-up only: same board, GPS moved onto jumpered pins so a suspect
; GPIO can be ruled out without touching the netlist record in
; src/devkitc/board_devkitc.h.
;
;   pio run -e devkitc-altpins -t upload -t monitor
;
; Never pick GPIO1 or GPIO3 — that is UART0, shared with the USB-serial bridge
; on the DevKitC module. The bridge and the GPS would drive the same line, and
; flashing and the console would stop working.
[env:devkitc-altpins]
extends = env:devkitc
build_flags = ${env:devkitc.build_flags} -DGPS_RX_PIN=18 -DGPS_TX_PIN=19
