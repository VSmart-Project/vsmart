AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Vsmart - Unified Infrastructure Stack
  Combines DynamoDB, SNS, AWS Location Service, AWS IoT Core, Lambda, and Cognito

Parameters:
  ProjectName:
    Type: String
    Default: Vsmart
    Description: Prefix for resource names
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  AlertEmail:
    Type: String
    Default: admin@example.com
    Description: Email for anti-theft alerts
  MapStyle:
    Type: String
    Default: VectorEsriNavigation
  BackendWebhookUrl:
    Type: String
    Default: ""
    AllowedPattern: "^$|^https://.+$"
    ConstraintDescription: Must be empty or an HTTPS URL
    Description: Public HTTPS URL of the backend realtime webhook
Resources:
  # ─── DYNAMODB ─────────────────────────────────────────────────────────────
  DevicesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${ProjectName}-Devices"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: deviceId
          AttributeType: S
        - AttributeName: ownerUserId
          AttributeType: S
        - AttributeName: antitheftEnabledStr
          AttributeType: S
      KeySchema:
        - AttributeName: deviceId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ownerUserId-index
          KeySchema:
            - AttributeName: ownerUserId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: antitheftEnabledStr-index
          KeySchema:
            - AttributeName: antitheftEnabledStr
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  DeviceStateTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${ProjectName}-DeviceState"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: deviceId
          AttributeType: S
        - AttributeName: isOnlineStr
          AttributeType: S
        - AttributeName: lastSeenAtMs
          AttributeType: N
      KeySchema:
        - AttributeName: deviceId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: isOnlineStr-lastSeenAtMs-index
          KeySchema:
            - AttributeName: isOnlineStr
              KeyType: HASH
            - AttributeName: lastSeenAtMs
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # ─── SNS TOPICS ───────────────────────────────────────────────────────────
  AntitheftAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-AntitheftAlerts"
      DisplayName: "IoT Anti-theft Alert"
      KmsMasterKeyId: alias/aws/sns
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  IoTErrorTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-IoTErrors"
      DisplayName: IoT Processing Errors
      KmsMasterKeyId: alias/aws/sns

  RealtimeWebhookSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub "${ProjectName} Lambda-to-backend realtime webhook key"
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  # ─── COGNITO USER POOL (NEW FOR AUTH) ─────────────────────────────────────
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "${ProjectName}-UserPool"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${ProjectName}-WebClient"
      GenerateSecret: false
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # ─── LOCATION SERVICE ─────────────────────────────────────────────────────
  LocationTracker:
    Type: AWS::Location::Tracker
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TrackerName: !Sub "${ProjectName}-Tracker"
      PricingPlan: RequestBasedUsage
      # Evaluate every received fix; retain history at the service's 30 s cadence.
      PositionFiltering: TimeBased

  GeofenceCollection:
    Type: AWS::Location::GeofenceCollection
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      CollectionName: !Sub "${ProjectName}-GeofenceCollection"
      PricingPlan: RequestBasedUsage

  TrackerConsumer:
    Type: AWS::Location::TrackerConsumer
    Properties:
      TrackerName: !Ref LocationTracker
      ConsumerArn: !GetAtt GeofenceCollection.Arn

  MapResource:
    Type: AWS::Location::Map
    Properties:
      MapName: !Sub "${ProjectName}-Map"
      Configuration:
        Style: !Ref MapStyle
      PricingPlan: RequestBasedUsage

  # ─── GEOFENCE EVENTS (SQS & EVENTBRIDGE) ──────────────────────────────────
  GeofenceEventQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-GeofenceEvents"
      VisibilityTimeout: 30
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt GeofenceEventDeadLetterQueue.Arn
        maxReceiveCount: 5

  GeofenceEventDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-GeofenceEvents-DLQ"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  GeofenceEventQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref GeofenceEventQueue
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt GeofenceEventQueue.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  GeofenceEventLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/events/${ProjectName}-GeofenceEvents"
      RetentionInDays: 7

  GeofenceEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-GeofenceEventRule"
      EventPattern:
        source: [aws.geo]
        detail-type: [Location Geofence Event]
        detail:
          GeofenceCollectionName: [!Ref GeofenceCollection]
      State: ENABLED
      Targets:
        - Arn: !GetAtt GeofenceEventQueue.Arn
          Id: GeofenceEventQueueTarget
        - Arn: !GetAtt GeofenceEventLogGroup.Arn
          Id: GeofenceEventLogTarget

  # ─── IOT & LAMBDA ─────────────────────────────────────────────────────────
  IoTLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-IoTMessageProcessor"
      RetentionInDays: 7

  IoTLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-IoTLambdaRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LocationServiceAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["geo:BatchUpdateDevicePosition"]
                Resource: !GetAtt LocationTracker.Arn
              - Effect: Allow
                Action: ["dynamodb:GetItem", "dynamodb:UpdateItem"]
                Resource: !GetAtt DevicesTable.Arn
              - Effect: Allow
                Action: ["dynamodb:GetItem", "dynamodb:UpdateItem"]
                Resource: !GetAtt DeviceStateTable.Arn
              - Effect: Allow
                Action: ["iot:DescribeEndpoint"]
                Resource: "*"
              - Effect: Allow
                Action: ["iot:Publish"]
                Resource:
                  - !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/users/*/events"
                  - !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/devices/*/events"
              - Effect: Allow
                Action: ["sns:Publish"]
                Resource: !Ref AntitheftAlertTopic
        - PolicyName: CloudWatchLogsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["logs:CreateLogGroup", "logs:CreateLogStream", "logs:PutLogEvents"]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-*"

  IoTMessageProcessorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-IoTMessageProcessor"
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt IoTLambdaExecutionRole.Arn
      Timeout: 30
      Environment:
        Variables:
          TRACKER_NAME: !Ref LocationTracker
          DEVICE_STATE_TABLE: !Ref DeviceStateTable
          DEVICES_TABLE: !Ref DevicesTable
          APP_EVENTS_TOPIC_TEMPLATE: "users/{userId}/events"
          DEBUG_DEVICE_EVENTS_TOPIC_TEMPLATE: "devices/{deviceId}/events"
          REALTIME_ENABLED: "true"
          ANTITHEFT_TOPIC_ARN: !Ref AntitheftAlertTopic
          BACKEND_WEBHOOK_URL: !Ref BackendWebhookUrl
          BACKEND_WEBHOOK_KEY: !Sub "{{resolve:secretsmanager:${RealtimeWebhookSecret}:SecretString}}"
      Code: lambda/iot-message-processor

  GeofenceEventConsumerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-GeofenceEventConsumer"
      RetentionInDays: 7

  GeofenceEventConsumerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-GeofenceEventConsumerRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: GeofenceQueueReadAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["sqs:ReceiveMessage", "sqs:DeleteMessage", "sqs:GetQueueAttributes"]
                Resource: !GetAtt GeofenceEventQueue.Arn
              - Effect: Allow
                Action: ["dynamodb:GetItem"]
                Resource: !GetAtt DeviceStateTable.Arn
              - Effect: Allow
                Action: ["dynamodb:GetItem"]
                Resource: !GetAtt DevicesTable.Arn
              - Effect: Allow
                Action: ["geo:GetGeofence"]
                Resource: !GetAtt GeofenceCollection.Arn
              - Effect: Allow
                Action: ["iot:DescribeEndpoint"]
                Resource: "*"
              - Effect: Allow
                Action: ["iot:Publish"]
                Resource:
                  - !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/users/*/events"
                  - !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/devices/*/events"

  GeofenceEventConsumerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-GeofenceEventConsumer"
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt GeofenceEventConsumerRole.Arn
      Timeout: 30
      Environment:
        Variables:
          DEVICE_STATE_TABLE: !Ref DeviceStateTable
          GEOFENCE_QUEUE_URL: !Ref GeofenceEventQueue
          GEOFENCE_COLLECTION: !Ref GeofenceCollection
          DEVICES_TABLE: !Ref DevicesTable
          APP_EVENTS_TOPIC_TEMPLATE: "users/{userId}/events"
          DEBUG_DEVICE_EVENTS_TOPIC_TEMPLATE: "devices/{deviceId}/events"
          REALTIME_ENABLED: "true"
          BACKEND_WEBHOOK_URL: !Ref BackendWebhookUrl
          BACKEND_WEBHOOK_KEY: !Sub "{{resolve:secretsmanager:${RealtimeWebhookSecret}:SecretString}}"
      Code: lambda/geofence-event-consumer

  GeofenceEventConsumerEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 10
      Enabled: true
      EventSourceArn: !GetAtt GeofenceEventQueue.Arn
      FunctionName: !Ref GeofenceEventConsumerFunction
      FunctionResponseTypes: [ReportBatchItemFailures]

  OfflineDetectorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-OfflineDetector"
      RetentionInDays: 7

  OfflineDetectorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-OfflineDetectorRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: OfflineDetectorAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["dynamodb:UpdateItem"]
                Resource: !GetAtt DeviceStateTable.Arn
              - Effect: Allow
                Action: ["dynamodb:Query"]
                Resource: !Sub "${DeviceStateTable.Arn}/index/isOnlineStr-lastSeenAtMs-index"
              - Effect: Allow
                Action: ["dynamodb:GetItem"]
                Resource: !GetAtt DevicesTable.Arn
              - Effect: Allow
                Action: ["iot:DescribeEndpoint"]
                Resource: "*"
              - Effect: Allow
                Action: ["iot:Publish"]
                Resource:
                  - !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/users/*/events"
                  - !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/devices/*/events"

  OfflineDetectorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-OfflineDetector"
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt OfflineDetectorRole.Arn
      Timeout: 30
      Environment:
        Variables:
          DEVICE_STATE_TABLE: !Ref DeviceStateTable
          DEVICES_TABLE: !Ref DevicesTable
          APP_EVENTS_TOPIC_TEMPLATE: "users/{userId}/events"
          DEBUG_DEVICE_EVENTS_TOPIC_TEMPLATE: "devices/{deviceId}/events"
          REALTIME_ENABLED: "true"
          OFFLINE_TIMEOUT_SECONDS: "120"
          BACKEND_WEBHOOK_URL: !Ref BackendWebhookUrl
          BACKEND_WEBHOOK_KEY: !Sub "{{resolve:secretsmanager:${RealtimeWebhookSecret}:SecretString}}"
      Code: lambda/offline-detector

  OfflineDetectorScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-OfflineDetectorSchedule"
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets:
        - Arn: !GetAtt OfflineDetectorFunction.Arn
          Id: OfflineDetectorLambdaTarget

  OfflineDetectorPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OfflineDetectorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt OfflineDetectorScheduleRule.Arn

  IoTLocationRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub "${ProjectName}_UpdateLocationTracker"
      TopicRulePayload:
        Sql: "SELECT * FROM 'location'"
        AwsIotSqlVersion: "2016-03-23"
        Actions:
          - Lambda:
              FunctionArn: !GetAtt IoTMessageProcessorFunction.Arn

  IoTHealthRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub "${ProjectName}_DeviceHealth"
      TopicRulePayload:
        Sql: "SELECT deviceid, gps, topic(2) AS sourceDeviceId, 'gps_health' AS messageType FROM 'devices/+/status'"
        AwsIotSqlVersion: "2016-03-23"
        Actions:
          - Lambda:
              FunctionArn: !GetAtt IoTMessageProcessorFunction.Arn

  IoTHealthLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IoTMessageProcessorFunction
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt IoTHealthRule.Arn

  IoTLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IoTMessageProcessorFunction
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !GetAtt IoTLocationRule.Arn

  IoTErrorRuleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-IoTErrorRuleRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: iot.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SNSPublishPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref IoTErrorTopic

  IoTErrorRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub "${ProjectName}_ErrorHandler"
      TopicRulePayload:
        Sql: !Sub "SELECT * FROM '$aws/rules/${ProjectName}_UpdateLocationTracker/error'"
        AwsIotSqlVersion: "2016-03-23"
        Actions:
          - Sns:
              TargetArn: !Ref IoTErrorTopic
              RoleArn: !GetAtt IoTErrorRuleRole.Arn
              MessageFormat: JSON

Outputs:
  CognitoUserPoolId:
    Value: !Ref UserPool
  CognitoClientId:
    Value: !Ref UserPoolClient
  DynamoTableName:
    Value: !Ref DevicesTable
  DeviceStateTableName:
    Value: !Ref DeviceStateTable
  Topics:
    Value: !Join [", ", [!Ref AntitheftAlertTopic, !Ref IoTErrorTopic]]
  RealtimeAppEventsTopicTemplate:
    Value: "users/{userId}/events"
  RealtimeRawTelemetryTopicTemplate:
    Value: "devices/{deviceId}/telemetry"
  RealtimeDebugDeviceEventsTopicTemplate:
    Value: "devices/{deviceId}/events"
  RealtimeRecommendedClientIdPrefix:
    Value: !Sub "${ProjectName}-mobile-"
  GeofenceEventConsumerFunctionName:
    Value: !Ref GeofenceEventConsumerFunction
  GeofenceEventQueueName:
    Value: !GetAtt GeofenceEventQueue.QueueName
  OfflineDetectorFunctionName:
    Value: !Ref OfflineDetectorFunction
  MapName:
    Value: !Ref MapResource
  RealtimeWebhookSecretArn:
    Description: Secret ARN to configure as REALTIME_WEBHOOK_KEY on the backend
    Value: !Ref RealtimeWebhookSecret
